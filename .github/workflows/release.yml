name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Dist
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/dist.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          scripts/release-notes.sh "$tag" > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            printf '%s\n\nSee CHANGELOG.md.\n' "lossless ${tag}" > /tmp/notes.md
          fi
          {
            echo
            echo "### Install"
            echo
            echo '```'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh"
            echo "lossless setup"
            echo '```'
            echo
            echo "Already installed: \`lossless update\`"
          } >> /tmp/notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "lossless ${tag}" --notes-file /tmp/notes.md
          else
            gh release create "$tag" dist/* --title "lossless ${tag}" --notes-file /tmp/notes.md
          fi
